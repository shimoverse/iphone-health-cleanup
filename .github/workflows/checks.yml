name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned direct dependency in an isolated environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r skills/iphone-health-cleanup/scripts/requirements.txt
      - name: Test fake-device safety and pinned API contracts
        run: .venv/bin/python -m unittest discover -s skills/iphone-health-cleanup/tests -v
      - name: Test Android safety with fake ADB only
        run: python -m unittest discover -s skills/android-health-cleanup/tests -v
      - name: Test installer and publication guards
        run: python -m unittest discover -s tests -v
      - name: Check public source boundary
        run: python tools/check_publication.py
