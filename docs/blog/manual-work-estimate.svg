<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">The repetitive part of manual cleanup</title><desc id="desc">Assuming 15 seconds per app: 20 apps take 5 minutes, 50 take 12.5 minutes, 100 take 25. Agent execution is not yet measured. These are arithmetic examples, excluding setup and review.</desc><rect width="1040" height="470" fill="#faf8f3"/><g font-family="Arial, sans-serif" fill="#25352e"><text x="44" y="48" font-size="28" font-weight="600">How much repetitive work is in the app list?</text><text x="44" y="78" font-size="17" fill="#617068">Illustrative manual time at 15 seconds per app. Setup and review excluded.</text><text x="44" y="169" font-size="19" >20 apps</text><rect x="180" y="146" width="140.0" height="32" rx="3" fill="#21654c"/><text x="330.0" y="169" font-size="19" >5 min</text><text x="44" y="243" font-size="19" >50 apps</text><rect x="180" y="220" width="350.0" height="32" rx="3" fill="#21654c"/><text x="540.0" y="243" font-size="19" >12.5 min</text><text x="44" y="317" font-size="19" >100 apps</text><rect x="180" y="294" width="700.0" height="32" rx="3" fill="#21654c"/><text x="890.0" y="317" font-size="19" >25 min</text><text x="180.0" y="365" font-size="16" fill="#617068" text-anchor="middle">0</text><text x="320.0" y="365" font-size="16" fill="#617068" text-anchor="middle">5</text><text x="460.0" y="365" font-size="16" fill="#617068" text-anchor="middle">10</text><text x="600.0" y="365" font-size="16" fill="#617068" text-anchor="middle">15</text><text x="740.0" y="365" font-size="16" fill="#617068" text-anchor="middle">20</text><text x="880.0" y="365" font-size="16" fill="#617068" text-anchor="middle">25</text><text x="880" y="389" font-size="16" fill="#617068" text-anchor="end">Minutes</text><text x="44" y="427" font-size="18" fill="#a75b29">Agent time: not measured. Savings and storage recovery: not established.</text></g></svg>