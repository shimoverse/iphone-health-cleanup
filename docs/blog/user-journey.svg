<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1120" viewBox="0 0 1040 1120" role="img" aria-labelledby="title desc"><title id="title">The phone cleanup user journey</title><desc id="desc">Ask naturally, choose and authorize the phone, inspect read-only, review an exact plan, then choose whether to approve. No approval means keep the report and make no changes. Approval leads to a small pilot and verification. Unclear or failed results stop for reconciliation. Verified supported actions can continue before checking the original symptom.</desc><rect width="1040" height="1120" fill="#faf8f3"/><g font-family="Arial, sans-serif" fill="#25352e"><text x="40" y="48.2" font-size="29" fill="#25352e" font-weight="600" text-anchor="start">The user journey</text><text x="40" y="82.4" font-size="18" fill="#617068" font-weight="400" text-anchor="start">Clear decisions before changes. Explicit stop points when evidence is missing.</text><rect x="40" y="115" width="590" height="75" rx="6" fill="#edf1e9"/><text x="58" y="146.8" font-size="21" fill="#25352e" font-weight="600" text-anchor="start">1. Ask in your own words</text><text x="58" y="175.6" font-size="17" fill="#617068" font-weight="400" text-anchor="start">“Check my phone and help me make space.”</text><rect x="40" y="225" width="590" height="75" rx="6" fill="#edf1e9"/><text x="58" y="256.8" font-size="21" fill="#25352e" font-weight="600" text-anchor="start">2. Choose and authorize the phone</text><text x="58" y="285.6" font-size="17" fill="#617068" font-weight="400" text-anchor="start">Confirm the device and supported connection.</text><rect x="40" y="335" width="590" height="75" rx="6" fill="#edf1e9"/><text x="58" y="366.8" font-size="21" fill="#25352e" font-weight="600" text-anchor="start">3. Inspect read-only</text><text x="58" y="395.6" font-size="17" fill="#617068" font-weight="400" text-anchor="start">Collect useful facts; label what is unknown.</text><rect x="40" y="445" width="590" height="75" rx="6" fill="#edf1e9"/><text x="58" y="476.8" font-size="21" fill="#25352e" font-weight="600" text-anchor="start">4. Review the exact plan</text><text x="58" y="505.6" font-size="17" fill="#617068" font-weight="400" text-anchor="start">See app identities, Keep/Review/Remove and consequences.</text><polyline points="335,190 335,225" fill="none" stroke="#617068" stroke-width="2"/><polygon points="330,217 340,217 335,225" fill="#617068"/><polyline points="335,300 335,335" fill="none" stroke="#617068" stroke-width="2"/><polygon points="330,327 340,327 335,335" fill="#617068"/><polyline points="335,410 335,445" fill="none" stroke="#617068" stroke-width="2"/><polygon points="330,437 340,437 335,445" fill="#617068"/><polyline points="335,520 335,550" fill="none" stroke="#617068" stroke-width="2"/><polygon points="330,542 340,542 335,550" fill="#617068"/><polygon points="335,550 475,610 335,670 195,610" fill="#dde8d9"/><text x="335" y="610" font-size="20" fill="#25352e" font-weight="600" text-anchor="middle" dominant-baseline="middle">Approve this list?</text><polyline points="475,610 700,610" fill="none" stroke="#617068" stroke-width="2"/><polygon points="692,605 692,615 700,610" fill="#617068"/><text x="555" y="595.6" font-size="17" fill="#617068" font-weight="400" text-anchor="start">No</text><rect x="700" y="570" width="300" height="80" rx="6" fill="#edf1e9"/><text x="718" y="601.8" font-size="21" fill="#25352e" font-weight="600" text-anchor="start">Keep the report</text><text x="718" y="630.6" font-size="17" fill="#617068" font-weight="400" text-anchor="start">No cleanup changes.</text><polyline points="335,670 335,710" fill="none" stroke="#21654c" stroke-width="2"/><polygon points="330,702 340,702 335,710" fill="#21654c"/><text x="350" y="694.6" font-size="17" fill="#21654c" font-weight="400" text-anchor="start">Yes</text><rect x="40" y="710" width="590" height="80" rx="6" fill="#edf1e9"/><text x="58" y="741.8" font-size="21" fill="#25352e" font-weight="600" text-anchor="start">5. Run a small pilot</text><text x="58" y="770.6" font-size="17" fill="#617068" font-weight="400" text-anchor="start">Start with up to two apps; recheck before each action.</text><polyline points="335,790 335,825" fill="none" stroke="#617068" stroke-width="2"/><polygon points="330,817 340,817 335,825" fill="#617068"/><rect x="40" y="825" width="590" height="80" rx="6" fill="#edf1e9"/><text x="58" y="856.8" font-size="21" fill="#25352e" font-weight="600" text-anchor="start">6. Verify the outcome</text><text x="58" y="885.6" font-size="17" fill="#617068" font-weight="400" text-anchor="start">Distinguish observed results, pending work and failures.</text><polyline points="630,865 700,865" fill="none" stroke="#995024" stroke-width="2"/><polygon points="692,860 692,870 700,865" fill="#995024"/><text x="660" y="798.6" font-size="17" fill="#995024" font-weight="400" text-anchor="start">Unclear / failed</text><rect x="700" y="825" width="300" height="80" rx="6" fill="#f2e8df"/><text x="718" y="856.8" font-size="21" fill="#25352e" font-weight="600" text-anchor="start">Stop and reconcile</text><text x="718" y="885.6" font-size="17" fill="#617068" font-weight="400" text-anchor="start">No blind retry.</text><polyline points="335,905 335,950" fill="none" stroke="#21654c" stroke-width="2"/><polygon points="330,942 340,942 335,950" fill="#21654c"/><text x="350" y="932.6" font-size="17" fill="#21654c" font-weight="400" text-anchor="start">Verified</text><rect x="40" y="950" width="590" height="80" rx="6" fill="#edf1e9"/><text x="58" y="981.8" font-size="21" fill="#25352e" font-weight="600" text-anchor="start">7. Continue, then recheck the symptom</text><text x="58" y="1010.6" font-size="17" fill="#617068" font-weight="400" text-anchor="start">Supported approved batch; measure space and the slow task.</text><text x="40" y="1074.6" font-size="17" fill="#995024" font-weight="400" text-anchor="start">A request already submitted may finish even if you disconnect.</text><text x="40" y="1102.8" font-size="16" fill="#617068" font-weight="400" text-anchor="start">This is the intended workflow, not a record of a live phone cleanup.</text></g></svg>