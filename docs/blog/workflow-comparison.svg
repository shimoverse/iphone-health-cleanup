<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc"><title id="title">Before and after the workflow</title><desc id="desc">Manual: locate, review, confirm and check one app, then repeat. With the skill: inventory, review an exact plan, approve, run a small pilot, verify then continue where supported. The human reviews both; no measured time comparison.</desc><rect width="1040" height="510" fill="#faf8f3"/><g font-family="Arial, sans-serif" fill="#25352e"><text x="40" y="47" font-size="28" font-weight="600">Before and after the workflow</text><text x="40" y="77" font-size="17" fill="#617068">A change in how the work is organized. No measured speedup is implied.</text><text x="40" y="128" font-size="22" font-weight="600">Manual</text><text x="530" y="128" font-size="22" font-weight="600">Agent + skill</text><rect x="40" y="155" width="450" height="47" rx="4" fill="#617068" fill-opacity="0.08"/><text x="56" y="184" font-size="18" >Find an app in Settings</text><path d="M265 204v10" stroke="#617068" fill="none"/><rect x="40" y="216" width="450" height="47" rx="4" fill="#617068" fill-opacity="0.08"/><text x="56" y="245" font-size="18" >Understand what deleting it affects</text><path d="M265 265v10" stroke="#617068" fill="none"/><rect x="40" y="277" width="450" height="47" rx="4" fill="#617068" fill-opacity="0.08"/><text x="56" y="306" font-size="18" >Confirm removal and check it</text><path d="M265 326v10" stroke="#617068" fill="none"/><rect x="40" y="338" width="450" height="47" rx="4" fill="#617068" fill-opacity="0.08"/><text x="56" y="367" font-size="18" >Navigate to the next app; repeat</text><rect x="530" y="155" width="450" height="47" rx="4" fill="#21654c" fill-opacity="0.08"/><text x="546" y="184" font-size="18" >Collect supported app facts</text><path d="M755 204v10" stroke="#617068" fill="none"/><rect x="530" y="216" width="450" height="47" rx="4" fill="#21654c" fill-opacity="0.08"/><text x="546" y="245" font-size="18" >Review and approve one exact plan</text><path d="M755 265v10" stroke="#617068" fill="none"/><rect x="530" y="277" width="450" height="47" rx="4" fill="#21654c" fill-opacity="0.08"/><text x="546" y="306" font-size="18" >Run a small pilot; verify the result</text><path d="M755 326v10" stroke="#617068" fill="none"/><rect x="530" y="338" width="450" height="47" rx="4" fill="#21654c" fill-opacity="0.08"/><text x="546" y="367" font-size="18" >Continue the same batch where supported</text><text x="40" y="444" font-size="20" font-weight="500">The person makes the cleanup decisions in both workflows.</text><text x="40" y="476" font-size="17" fill="#617068">Protected apps stay kept. Changed targets need review. Interrupted requests are reconciled.</text></g></svg>